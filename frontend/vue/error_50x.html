<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./src/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css">
    <title>Error 50x</title>
    <script>
      (function () {
        try {
          const persisted = localStorage.getItem('app-theme');
          if (persisted) {
            const store = JSON.parse(persisted);
            if (store?.current) {
              document.documentElement.setAttribute('data-theme', store.current);
              return;
            }
          }
        } catch (e) { console.error(e); }
        document.documentElement.setAttribute('data-theme', 'light');
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/modules/error_pages/50x/main.js"></script>
  </body>
</html>
