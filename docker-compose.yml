services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    env_file: .env
    expose:
      - "5432"
    networks:
      - ft_cat-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 1s
      timeout: 1s
      retries: 180
    ports:
      - "5444:5432"
  back:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - ft_cat-network
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .jj
            - .git
            - .direnv

  front:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    ports:
      - "${EXTERNAL_PORT}:443"
    networks:
      - ft_cat-network
    depends_on:
      - back

  redis:
    image: redis:alpine
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    env_file: .env
    expose:
      - "6379"
    user: "1000:1000"  # redis user UID in the container
    # entrypoint: |
    #   sh -c 'chown -R 1000:1000 /data && exec redis-server --dir /data'
    volumes:
      - ./volumes/redis-data:/data
    networks:
      - ft_cat-network
    depends_on:
      - back

networks:
  ft_cat-network:
    driver: bridge
