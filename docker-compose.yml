services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    env_file: .env
    volumes:
      - ./volumes/db-data:/var/lib/postgresql
    expose:
      - "5432"
    networks:
      - ft_cat-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 1s
      timeout: 1s
      retries: 180
    ports:
      - "5444:5432"
    command: ["postgres", "-c", "log_statement=all"]

  back:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./volumes/backend-data:/media
    expose:
      - "8000"
    ports:
      - "8000:8000"
    networks:
      - ft_cat-network
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; print(urllib.request.urlopen('http://localhost:8000').read().decode())\""]
      interval: 1s
      timeout: 1s
      retries: 180
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - .jj
            - .git
            - .direnv

  front:
    build: ./frontend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./volumes/backend-data:/media:ro
    ports:
      - "${EXTERNAL_PORT}:443"
    networks:
      - ft_cat-network
    depends_on:
      back:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - .jj
            - .git
            - .direnv

  redis:
    image: redis:alpine
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    env_file: .env
    command: redis-server --dir /data --save 120 1
    volumes:
      - ./volumes/redis-data:/data
    expose:
      - "6379"
    networks:
      - ft_cat-network
    depends_on:
      - back

networks:
  ft_cat-network:
    driver: bridge
